<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Structure</title>
    <style>
        /* RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; min-height: 100vh; }

        /* NAV LATERAL (SIDEBAR) */
        nav {
            width: 250px;
            background: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        nav h2 { margin-bottom: 30px; color: #4CAF50; text-align: center; border: 2px solid #4CAF50; padding: 10px; }
        nav a {
            color: #aaa;
            text-decoration: none;
            padding: 15px;
            border-bottom: 1px solid #333;
            transition: 0.3s;
        }
        nav a:hover { color: #fff; background: #333; padding-left: 20px; }

        /* ÁREA DE CONTEÚDO (DIREITA) */
        .content-area {
            flex: 1; /* Ocupa o resto da tela */
            display: flex;
            flex-direction: column;
        }

        /* HEADER DO DASHBOARD (TOPBAR) */
        header {
            background: #fff;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* MAIN: ONDE OS WIDGETS FICAM */
        main {
            padding: 30px;
            background: #f0f2f5;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* SECTION: CADA WIDGET/CARTÃO */
        section {
            background: #85d688;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-top: 4px solid #4CAF50; /* Identidade visual do card */
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #85d688;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <nav>
        <h2>DASHBOARD</h2>
        <a href="#">Visão Geral</a>
        <a href="#">Relatórios</a>
        <a href="#">Usuários</a>
        <a href="#">Configurações</a>
    </nav>

    <div class="content-area">
        <header>
            <h1>Bem-vindo, Admin</h1>
            <div>
                <button>Sair</button>
            </div>
        </header>

        <main>
            <section>
                <h3>Vendas Hoje</h3>
                <p>R$ 17.251,06/p>
            </section>
            <section>
                <h3>Novos Usuários</h3>
                <p>+15 cadastros</p>
            </section>
            <section>
                <h3>Servidor</h3>
                <p>Online (98% Uptime)</p>
            </section>
        </main>

        <footer>
            Sistema v1.0 - Revoluxti Corp
        </footer>
    </div>

</body>
</html>
