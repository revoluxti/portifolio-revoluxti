<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bolão Dance & Drinks</title>
    <style>
        /* PALETA: NIGHTLIFE UNDERGROUND */
        :root {
            --bg: #000000;
            --neon-red: #ff003c;    /* Vermelho Laser */
            --neon-yellow: #fcee0a; /* Amarelo Estrobo */
            --glass: rgba(20, 20, 20, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow-x: hidden;
            /* Efeito de granulação (Noise) no fundo */
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.1"/%3E%3C/svg%3E');
        }

        /* LUZES AMBIENTES (Vigas de luz) */
        body::before {
            content: ''; position: fixed; top: -100px; left: 20%;
            width: 200px; height: 100vh;
            background: linear-gradient(180deg, var(--neon-red), transparent);
            filter: blur(80px); opacity: 0.4; z-index: -1;
            transform: rotate(15deg);
        }
        body::after {
            content: ''; position: fixed; bottom: -100px; right: 20%;
            width: 300px; height: 80vh;
            background: linear-gradient(0deg, var(--neon-yellow), transparent);
            filter: blur(100px); opacity: 0.3; z-index: -1;
            transform: rotate(-15deg);
        }

        header {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--neon-red);
        }

        .logo {
            font-size: 4rem;
            line-height: 0.8;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 2px #fff;
            position: relative;
        }
        .logo span { color: var(--neon-yellow); -webkit-text-stroke: 0; display: block; font-size: 1.5rem; letter-spacing: 5px;}

        nav ul { display: flex; gap: 20px; list-style: none; }
        nav a {
            color: #fff; text-decoration: none; font-size: 1.2rem;
            text-transform: uppercase; letter-spacing: 2px;
            padding: 10px; border: 1px solid transparent;
            transition: 0.3s;
        }
        nav a:hover {
            background: var(--neon-red);
            box-shadow: 0 0 20px var(--neon-red);
            border-color: var(--neon-red);
            transform: skewX(-10deg);
        }

        main { padding: 60px 40px; max-width: 1200px; margin: 0 auto; }

        /* GRID DE CARTAZES */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        article {
            background: var(--glass);
            border: 1px solid #333;
            position: relative;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            transition: 0.3s;
            overflow: hidden;
        }

        /* Efeito de imagem cortada */
        article::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(0deg, #000, transparent);
            z-index: 1;
        }

        article:hover {
            border-color: var(--neon-yellow);
            box-shadow: 5px 5px 0 var(--neon-red); /* Sombra sólida deslocada */
            transform: translate(-5px, -5px);
        }

        h2 { 
            position: relative; z-index: 2; font-size: 2.5rem; 
            text-transform: uppercase; margin-bottom: 10px;
            color: var(--neon-yellow);
        }
        
        p.date {
            position: relative; z-index: 2; color: #fff; 
            font-family: 'Courier New', monospace; letter-spacing: 2px;
        }

        .cta-btn {
            margin-top: 20px; z-index: 2; position: relative;
            background: transparent; color: #fff; border: 2px solid #fff;
            padding: 10px 20px; text-transform: uppercase; font-weight: bold; cursor: pointer;
        }
        .cta-btn:hover { background: #fff; color: #000; }

        footer {
            margin-top: 80px; padding: 40px; text-align: center;
            border-top: 1px solid #333; font-family: monospace; color: #666;
        }

        /* Animação de Letreiro Piscando */
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-dot { 
            display: inline-block; width: 10px; height: 10px; 
            background: var(--neon-red); border-radius: 50%; 
            animation: blink 1s infinite; margin-right: 10px;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            Bolão<br><span>Dance</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Line-up</a></li>
                <li><a href="#">Camarotes</a></li>
                <li><a href="#">Lista VIP</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div style="margin-bottom: 40px; font-family: monospace; color: #888;">
            <span class="live-dot"></span>CASA ABERTA HOJE ÀS 23:00
        </div>

        <section class="event-grid">
            <article>
                <p class="date">SEXTA // 12 DEZ</p>
                <h2>Noite<br>Vermelha</h2>
                <button class="cta-btn">Reservar</button>
            </article>

            <article style="border-color: var(--neon-yellow);">
                <p class="date">SÁBADO // 13 DEZ</p>
                <h2 style="color: var(--neon-red);">Bolão<br>Drinks</h2>
                <button class="cta-btn" style="border-color: var(--neon-yellow);">Open Bar</button>
            </article>

            <article>
                <p class="date">DOMINGO // 14 DEZ</p>
                <h2>Pagode<br>do Bolão</h2>
                <button class="cta-btn">Lista Free</button>
            </article>
        </section>
    </main>

    <footer>
        <p>SYSTEM POWERED BY REVOLUXTI NIGHTLIFE &copy; 2025</p>
    </footer>

</body>
</html>
