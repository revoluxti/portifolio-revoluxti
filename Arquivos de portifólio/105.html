<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bolão Dance - Underground</title>
    <style>
        /* --- PALETA: RED ALERT DISTRICT --- */
        :root {
            --bg: #050505;
            --grid-line: #1a1a1a;
            --neon-red: #ff003c;    /* Vermelho Laser */
            --neon-yellow: #fcee0a; /* Amarelo Warning */
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            
            /* EFEITO DE PORTA DE AÇO/GRADE INDUSTRIAL */
            /* Cria um padrão xadrez escuro no fundo */
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            
            /* Vinheta para escurecer as bordas (Mistério) */
            box-shadow: inset 0 0 150px #000;
        }

        /* HEADER SEMÂNTICO: Estilo Letreiro Neon Falhado */
        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid var(--neon-red);
            position: relative;
            overflow: hidden;
        }

        /* Efeito de luz vazando */
        header::after {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 300px; height: 10px; background: var(--neon-red);
            box-shadow: 0 0 50px 20px var(--neon-red);
            opacity: 0.5;
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            /* Texto com contorno amarelo e preenchimento transparente */
            -webkit-text-stroke: 2px var(--text);
            color: transparent;
            text-shadow: 5px 5px 0px var(--neon-red);
            font-style: italic;
        }

        nav ul {
            display: flex; justify-content: center; gap: 30px; margin-top: 20px; list-style: none;
        }
        nav a { 
            color: var(--neon-yellow); 
            text-decoration: none; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.9rem;
            background: #000;
            padding: 5px 10px;
            border: 1px solid var(--neon-yellow);
        }
        nav a:hover { background: var(--neon-yellow); color: #000; }

        /* MAIN */
        main {
            flex: 1;
            padding: 60px 20px;
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            gap: 40px;
        }

        /* CARD DE EVENTO */
        article {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #333;
            padding: 30px;
            position: relative;
            /* Recorte Diagonal (Tendência Cyber) */
            clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
        }

        article:hover { border-color: var(--neon-red); }

        h2 { font-size: 2.5rem; margin-bottom: 10px; color: var(--text); }
        
        .tag { 
            background: var(--neon-red); color: #000; padding: 5px 10px; 
            font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 15px;
        }

        .lineup { color: var(--neon-yellow); font-family: monospace; font-size: 1.1rem; margin-top: 20px; display: block; }

        /* SEÇÃO DE DRINKS */
        section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .drink-card {
            border: 1px solid var(--neon-yellow);
            padding: 20px;
            background: #000;
            text-align: center;
        }
        .drink-card h3 { color: var(--neon-yellow); text-transform: uppercase; }

        footer {
            text-align: center;
            padding: 30px;
            background: #000;
            border-top: 1px solid #222;
            color: #666;
            font-size: 0.8rem;
            font-family: monospace;
        }

        @media (max-width: 600px) { h1 { font-size: 2.5rem; } section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>BOLÃO<br>DANCE</h1>
        <nav>
            <ul>
                <li><a href="#">Line-up</a></li>
                <li><a href="#">Vip List</a></li>
                <li><a href="#">Drinks</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <span class="tag">HOJE 23:00</span>
            <h2>NOITE INDUSTRIAL</h2>
            <p>O melhor do Techno e House Music em um ambiente imersivo. Luzes, fumaça e graves pesados.</p>
            <span class="lineup">DJ MISTERY // DJ BOLÃO // B2B</span>
        </article>

        <section>
            <div class="drink-card">
                <h3>Gin Tônica Neon</h3>
                <p style="color: #fff; margin-top: 5px;">R$ 25,00</p>
            </div>
            <div class="drink-card">
                <h3>Energy Combo</h3>
                <p style="color: #fff; margin-top: 5px;">R$ 40,00</p>
            </div>
        </section>
    </main>

    <footer>
        SYSTEM BY REVOLUXTI &bull; NIGHTLIFE TECH
    </footer>

</body>
</html>
