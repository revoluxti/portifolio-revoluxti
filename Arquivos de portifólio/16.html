<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Theme</title>
    <style>
        /* --- TEMA SUNSET CREATIVE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif; /* Fonte moderna */
            line-height: 1.6;
            background: #2d1b4e; /* Roxo Profundo */
            color: #fff;
        }

        header {
            /* Gradiente Roxo para Laranja */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        header h1 {
            color: #fff;
            font-size: 3em;
            font-weight: 900;
            letter-spacing: -1px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            background: rgba(255,255,255,0.1); /* Vidro */
            display: inline-flex;
            padding: 10px 30px;
            border-radius: 50px;
        }

        nav ul li { margin: 0 15px; }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }
        nav ul li a:hover { color: #ffd700; }

        main { padding: 40px 20px; max-width: 800px; margin: 0 auto; }

        section {
            background: rgba(255, 255, 255, 0.05); /* Efeito Vidro Escuro */
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h2 {
            /* Texto Gradiente */
            background: -webkit-linear-gradient(#fff, #ff9a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: #ff9a9e; /* Rosa Salmão */
            margin-bottom: 15px;
            font-size: 2em;
        }

        .services ul {
            list-style: none;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .services ul li {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            color: #2d1b4e;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <header>
        <h1>Creative Studio</h1>
        <nav>
            <ul>
                <li><a href="#">Work</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Blog</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="intro">
            <h2>We Create Art.</h2>
            <p>Pushing boundaries with vibrant designs and seamless user experiences. Let's build something beautiful together.</p>
        </section>
        <section class="services">
            <h2>Skills</h2>
            <ul>
                <li>UI Design</li>
                <li>Branding</li>
                <li>Social Media</li>
                <li>Motion Graphics</li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 REVOLUXTI Design. All rights reserved.</p>
    </footer>
</body>
</html>
