<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Arcade</title>
    <style>
        /* --- PALETA: RETROWAVE --- */
        :root {
            --bg: #10002b;
            --grid-line: #e0aaff;
            --sun: #ff9e00;
            --pink: #ff006e;
            --cyan: #00f5d4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Verdana', sans-serif;
            background-color: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* SOL RETRO */
        .sun {
            position: absolute;
            top: 5vh; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px;
            background: linear-gradient(to top, var(--sun), #ff006e);
            border-radius: 50%;
            z-index: -2;
            box-shadow: 0 0 60px var(--pink);
        }
        .sun::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 50%;
            background: repeating-linear-gradient(to bottom, transparent 0%, transparent 10%, var(--bg) 10%, var(--bg) 12%);
        }

        /* CHÃO 3D */
        .floor {
            position: absolute;
            bottom: -50%; left: -50%;
            width: 200%; height: 100%;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
            opacity: 0.3;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
        }

        header {
            text-align: center;
            padding: 30px 20px;
            z-index: 10;
        }

        header h1 {
            font-family: 'Impact', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            font-style: italic;
            background: linear-gradient(to bottom, #fff 0%, #ccc 50%, var(--cyan) 51%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 4px 0px var(--pink));
            line-height: 1;
        }

        nav { margin-top: 20px; }
        nav a {
            color: var(--cyan);
            text-decoration: none;
            font-family: monospace;
            font-size: 1.2rem;
            margin: 0 15px;
            text-shadow: 0 0 5px var(--cyan);
            font-weight: bold;
        }
        nav a:hover { color: #fff; text-shadow: 0 0 10px #fff; }

        /* MAIN */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 40px 20px;
            z-index: 10;
        }

        .arcade-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            border: 2px solid var(--cyan);
            padding: 25px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 15px var(--cyan), inset 0 0 20px rgba(0, 245, 212, 0.2);
            transform: skew(-5deg);
            margin-bottom: 20px; /* Margem de segurança pro mobile */
        }

        .arcade-card:nth-child(2) { border-color: var(--pink); box-shadow: 0 0 15px var(--pink); }

        h2 { font-size: 1.5rem; color: #fff; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        p { color: #ddd; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }

        .btn-retro {
            display: block; width: 100%;
            padding: 12px;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-retro:active { background: #fff; color: #000; }

        footer {
            text-align: center;
            padding: 15px;
            color: var(--grid-line);
            font-family: monospace;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            font-size: 0.8rem;
        }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 768px) {
            header h1 { font-size: 2.8rem; } /* Título menor */
            
            main { 
                flex-direction: column; /* Cards um embaixo do outro */
                padding-top: 100px; /* Empurra pra baixo pra não cobrir o sol */
                align-items: center;
            }
            
            .arcade-card { 
                width: 100%; 
                max-width: 350px; 
                transform: skew(0deg); /* Tira a inclinação no mobile pra alinhar melhor */
            }
            
            .sun { 
                width: 200px; height: 200px; 
                top: 10vh; /* Sobe o sol */
            }
            
            /* Ajusta o chão 3D para não ficar na frente do texto */
            .floor { bottom: -20%; opacity: 0.2; }
            
            nav { display: flex; flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="sun"></div>
    <div class="floor"></div>

    <header>
        <h1>BOLÃO<br>ARCADE</h1>
        <nav>
            <a href="#">START</a>
            <a href="#">MENU</a>
            <a href="#">SCORES</a>
        </nav>
    </header>

    <main>
        <article class="arcade-card">
            <h2>Smash Burger</h2>
            <p>180g de carne, queijo cheddar derretido e molho pixel especial.</p>
            <button class="btn-retro">INSERT COIN</button>
        </article>

        <article class="arcade-card">
            <h2 style="color: var(--pink)">Combo Player 1</h2>
            <p>Burger + Batata Rústica + Refri Refill infinito.</p>
            <button class="btn-retro" style="border-color: var(--pink)">SELECT</button>
        </article>
    </main>

    <footer>
        REVOLUXTI STUDIOS © 198X - 2025
    </footer>

</body>
</html>
