<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bolão Sorvetes - Sweet Pop</title>
    <style>
        /* --- PALETA: CANDY SHOP INSTAGRAM --- */
        :root {
            --bg: #fff0f5;        /* Rosa Algodão Doce Muito Claro */
            --grid: #ffcce0;      /* Grade Rosa */
            --pink: #ff85a2;      /* Rosa Chiclete */
            --blue: #8aebf9;      /* Azul Céu */
            --yellow: #fce38a;    /* Amarelo Banana */
            --text: #4a4a4a;      /* Cinza Escuro (Leitura) */
            /* Gradiente Instagram para detalhes */
            --insta-grad: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fredoka One', 'Verdana', sans-serif; /* Fonte Arredondada/Divertida */
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            
            /* PADRÃO DE FUNDO: GRID MILIMETRADO SUAVE */
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* HEADER DIVERTIDO */
        header {
            padding: 20px;
            text-align: center;
            background: #fff;
            border-bottom: 5px solid var(--pink);
            /* Borda ondulada usando CSS clip-path seria complexo, vamos usar border-radius */
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 10px 20px rgba(255, 133, 162, 0.2);
        }

        h1 {
            font-size: 3rem;
            color: var(--pink);
            text-transform: lowercase;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        
        /* O "Bolão" com gradiente Insta */
        h1 span {
            background: var(--insta-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 4rem;
        }

        nav {
            background: var(--yellow);
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            transform: rotate(-2deg); /* Leve rotação para diversão */
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }

        nav a { margin: 0 15px; text-decoration: none; color: #d35400; font-weight: bold; font-size: 1.1rem; }

        /* MAIN */
        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        /* CARDS FLUTUANTES (Soft UI) */
        .flavor-card {
            background: #fff;
            padding: 40px 20px;
            border-radius: 30px;
            text-align: center;
            position: relative;
            transition: 0.3s;
            border: 2px solid #fff;
        }

        /* Hover com borda colorida estilo Instagram */
        .flavor-card:hover {
            transform: translateY(-10px);
            /* Truque para borda gradiente */
            background: linear-gradient(#fff, #fff) padding-box,
                        var(--insta-grad) border-box;
            border: 4px solid transparent;
        }

        .circle-img {
            width: 120px; height: 120px;
            background: var(--blue);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #fff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .flavor-card:nth-child(2) .circle-img { background: var(--pink); }
        .flavor-card:nth-child(3) .circle-img { background: var(--yellow); color: #d35400; }

        h2 { font-size: 1.5rem; margin-bottom: 5px; }
        p { font-size: 0.9rem; color: #888; }

        /* BOTÃO CTA */
        .insta-btn {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 40px;
        }
        
        button {
            background: var(--insta-grad);
            border: none;
            color: white;
            padding: 20px 50px;
            font-size: 1.5rem;
            border-radius: 50px;
            font-family: 'Fredoka One', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.4);
            transition: 0.3s;
        }
        button:hover { transform: scale(1.05); }

        footer {
            text-align: center;
            margin-top: 80px;
            padding: 20px;
            background: #fff;
            color: #ccc;
            font-size: 0.8rem;
        }
        footer strong { color: var(--pink); }

        @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>Sorveteria do<br><span>BOLÃO</span></h1>
        <nav>
            <a href="#">Sabores</a>
            <a href="#">Milkshakes</a>
            <a href="#">Açaí</a>
        </nav>
    </header>

    <main>
        <article class="flavor-card">
            <div class="circle-img">🍦</div>
            <h2>Blue Ice</h2>
            <p>Sabor chiclete com pedacinhos de marshmallow.</p>
        </article>

        <article class="flavor-card">
            <div class="circle-img">🍓</div>
            <h2>Morango Split</h2>
            <p>Morango real com calda de chocolate quente.</p>
        </article>

        <article class="flavor-card">
            <div class="circle-img">🍌</div>
            <h2>Banana Split</h2>
            <p>O clássico com 3 bolas e muita cobertura.</p>
        </article>

        <div class="insta-btn">
            <button>@bolao_sorvetes</button>
        </div>
    </main>

    <footer>
        Developed by <strong>REVOLUXTI</strong>. Sweet Code.
    </footer>

</body>
</html>
