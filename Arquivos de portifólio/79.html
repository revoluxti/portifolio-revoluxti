<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bold Retail - American Style</title>
    <style>
        /* --- ESTILO: AMERICAN BOLD --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Impact', 'Arial Black', sans-serif; /* Fontes pesadas */
            background: #000;
            color: #fff;
        }

        /* HEADER COM MARQUEE (Texto Correndo) */
        .marquee-container {
            background: #fff;
            color: #000;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 5px solid #000;
        }
        .marquee-text {
            display: inline-block;
            animation: scroll 10s linear infinite;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        /* GRID PRINCIPAL */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Duas colunas */
            grid-template-rows: 50vh 50vh;  /* Duas linhas */
        }

        /* --- SEÇÃO 1: FARMA 100 DESC (Roxo e Verde) --- */
        .section-farma {
            background-color: #240046; /* Roxo Profundo */
            color: #39ff14; /* Verde Neon */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            border-right: 5px solid #000;
            border-bottom: 5px solid #000;
            position: relative;
        }
        .section-farma h2 { font-size: 4rem; line-height: 0.9; text-transform: uppercase; }
        .tag-promo { background: #39ff14; color: #240046; padding: 5px 15px; font-size: 1rem; width: fit-content; margin-bottom: 20px;}

        /* --- SEÇÃO 2: TRUCKMAIS (Logística - Amarelo e Preto) --- */
        .section-truck {
            background-color: #ffcc00; /* Amarelo Segurança */
            color: #111;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            border-bottom: 5px solid #000;
            /* Listras industriais com CSS Gradient */
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
        }
        .section-truck h2 { font-size: 3rem; text-transform: uppercase; border-bottom: 5px solid #000; padding-bottom: 10px; display: inline-block;}
        .truck-icon { font-size: 5rem; text-align: right; }

        /* --- SEÇÃO 3: SKATE SHOP (Xadrez) --- */
        .section-skate {
            grid-column: span 2; /* Ocupa a largura total embaixo */
            background: #fff;
            color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Padrão Xadrez (Checkerboard) com CSS Puro */
        .checker-bg {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            background-image: conic-gradient(#000 90deg, #fff 90deg 180deg, #000 180deg 270deg, #fff 270deg);
            background-size: 50px 50px;
            opacity: 0.2; /* Suave no fundo */
            z-index: 0;
        }

        .skate-content {
            z-index: 1;
            background: #000;
            color: #fff;
            padding: 40px 80px;
            transform: rotate(-2deg); /* Atitude Rebelde */
            box-shadow: 10px 10px 0px red; /* Sombra dura vermelha */
        }
        
        .skate-content h2 { font-size: 3rem; text-transform: uppercase; margin: 0; }

        @media (max-width: 768px) { main { grid-template-columns: 1fr; grid-template-rows: auto; } .section-skate { padding: 60px 20px; } }
    </style>
</head>
<body>

    <header>
        <div class="marquee-container">
            <span class="marquee-text">🚀 DR. EXPRESS: ENTREGA EM 24H • FARMA100DESC: SUPLEMENTOS COM 50% OFF • TRUCKMAIS: LOGÍSTICA PESADA • REVOLUXTI EXPANDS IDEAS •</span>
        </div>
    </header>

    <main>
        <article class="section-farma">
            <span class="tag-promo">FARMA100DESC</span>
            <h2>Power<br>Whey<br>Isolate</h2>
            <p style="font-family: sans-serif; margin-top: 20px; font-weight: bold;">
                SUPLEMENTAÇÃO ULTRA PURA.<br>
                <span style="border-bottom: 3px solid #39ff14;">COMPRAR AGORA ></span>
            </p>
        </article>

        <section class="section-truck">
            <div>
                <h2>Truck<br>Mais</h2>
                <p style="font-family: monospace; font-weight: bold; margin-top: 10px;">LOGÍSTICA & TRANSPORTE</p>
            </div>
            <div class="truck-icon">🚛📦</div>
            <button style="background: #000; color: #ffcc00; border: none; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Rastrear Carga</button>
        </section>

        <section class="section-skate">
            <div class="checker-bg"></div>
            <div class="skate-content">
                <h2>Radical Street</h2>
                <p style="text-align: center; color: red; font-family: monospace;">SINCE 1998</p>
            </div>
        </section>
    </main>

</body>
</html>
