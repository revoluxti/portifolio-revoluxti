<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Semântica 3 - OLED Gallery</title>
    <style>
        /* PALETA: MONOCHROME DARK (Foco na Imagem) */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Helvetica', sans-serif;
            background: #000000; /* Preto Real */
            color: #b0b0b0;      /* Cinza médio */
            display: flex;
            min-height: 100vh;
        }

        /* HEADER LATERAL (SIDEBAR) */
        header {
            width: 260px;
            background: #0a0a0a; /* Quase preto, separa sutilmente */
            border-right: 1px solid #222;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        header h1 { 
            color: #fff; 
            font-size: 2rem; 
            margin-bottom: 60px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        nav ul { list-style: none; display: flex; flex-direction: column; gap: 20px; }
        
        nav a { 
            color: #666; 
            text-decoration: none; 
            font-size: 1rem; 
            transition: 0.3s; 
        }
        nav a:hover { color: #fff; padding-left: 10px; } /* Movimento suave */

        /* MAIN */
        main {
            margin-left: 260px; 
            padding: 80px;
            width: 100%;
            background: #000; /* Continua o fundo preto */
        }

        h2 { 
            color: #fff; 
            font-size: 1.8rem; 
            margin-bottom: 40px; 
            font-weight: normal;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
        }

        /* GALERIA */
        .galeria {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        figure {
            background: #111; /* Cartão sutilmente mais claro que o fundo */
            padding: 10px;
            border: 1px solid #222;
            border-radius: 4px;
            width: 300px;
            transition: transform 0.3s, border-color 0.3s;
        }

        figure:hover {
            transform: translateY(-5px);
            border-color: #444; /* Borda acende levemente */
        }

        /* Placeholder para imagem cinza escuro */
        figure div.img-placeholder {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 2rem;
        }

        figcaption {
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        figcaption span {
            display: block;
            font-size: 0.75rem;
            color: #555;
            margin-top: 5px;
            font-weight: normal;
        }

        .sidebar-footer { margin-top: auto; font-size: 0.7rem; color: #444; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            header { width: 100%; position: relative; height: auto; border-right: none; border-bottom: 1px solid #222;}
            main { margin-left: 0; padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>RAW<br>STUDIO</h1>
        <nav>
            <ul>
                <li><a href="#">Trabalhos</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">&copy; 2025 Minimal Dark.</div>
    </header>

    <main>
        <h2>Projetos Recentes</h2>

        <section class="galeria">
            <figure>
                <div class="img-placeholder"><i class="bi bi-image"></i></div>
                <figcaption>
                    Fotografia Noturna
                    <span>Tóquio, 2024</span>
                </figcaption>
            </figure>

            <figure>
                <div class="img-placeholder"><i class="bi bi-box"></i></div>
                <figcaption>
                    Design de Produto
                    <span>Conceito Minimalista</span>
                </figcaption>
            </figure>

            <figure>
                <div class="img-placeholder"><i class="bi bi-pen"></i></div>
                <figcaption>
                    Identidade Visual
                    <span>Branding Dark Mode</span>
                </figcaption>
            </figure>
        </section>

        <p style="margin-top: 50px; color: #444; font-size: 0.9rem;">
            A estrutura lateral fixa (Sidebar) é comum em sites criativos. Aqui usamos tons de preto sobre preto ("Black on Black") para garantir que o foco seja apenas o conteúdo, sem brilho excessivo.
        </p>
    </main>

</body>
</html>
