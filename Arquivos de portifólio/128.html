<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farma100desc - Power</title>
    <style>
        :root {
            --bg: #13001e;
            --primary: #52006a;
            --neon: #00ff9d;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial Black', sans-serif;
            background-color: var(--bg);
            color: var(--white);
            overflow-x: hidden;
        }

        header {
            padding: 20px;
            display: flex;
            flex-wrap: wrap; /* Permite quebrar linha se apertar */
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            gap: 20px;
        }

        .logo {
            font-size: 1.5rem; color: var(--neon); text-transform: uppercase; font-style: italic; letter-spacing: -1px;
        }

        nav {
            display: flex; gap: 15px;
        }

        nav a {
            color: #fff; text-decoration: none; font-size: 0.8rem; font-weight: normal; font-family: Arial, sans-serif; text-transform: uppercase;
        }
        nav a:hover { color: var(--neon); text-decoration: line-through; }

        main { padding: 40px 20px; text-align: center; }

        /* TIPOGRAFIA RESPONSIVA */
        .big-type {
            font-size: 15vw; /* O tamanho da fonte é 15% da largura da tela */
            line-height: 0.85;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 1px var(--white); /* Borda mais fina no mobile */
            position: relative;
            z-index: 1;
            transition: 0.3s;
        }
        
        .subtitle {
            font-family: Arial, sans-serif; color: var(--primary); font-weight: bold; letter-spacing: 3px; margin-top: 20px; font-size: 1rem;
        }

        /* GRID PRODUTOS */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 60px;
            max-width: 1200px;
            margin-left: auto; margin-right: auto;
        }

        article {
            background: linear-gradient(180deg, rgba(82,0,106,0.2) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--primary); padding: 25px; position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 90% 100%, 0 100%);
        }

        h2 { font-size: 1.8rem; margin-bottom: 10px; font-style: italic; }
        .price { color: var(--neon); font-size: 1.4rem; display: block; margin-bottom: 15px; }

        button {
            background: var(--neon); color: #000; border: none; padding: 15px 0; font-weight: bold; text-transform: uppercase; font-style: italic; width: 100%; cursor: pointer;
        }

        footer { margin-top: 80px; background: var(--neon); color: #000; padding: 20px; text-align: center; font-family: Arial, sans-serif; font-weight: bold; font-size: 0.8rem; }

        /* AJUSTES MOBILE ESPECÍFICOS */
        @media (max-width: 600px) {
            header { justify-content: center; text-align: center; }
            .big-type { -webkit-text-stroke: 1px var(--white); } /* Garante visibilidade */
            article { margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Farma100desc</div>
        <nav>
            <a href="#">Whey</a>
            <a href="#">Creatina</a>
            <a href="#">Pré-Treino</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="subtitle">PERFORMANCE</div>
            <div class="big-type">PUMP</div>
            <div class="big-type" style="-webkit-text-stroke-color: var(--primary);">FOCUS</div>
            <div class="big-type">POWER</div>
        </section>

        <section class="product-grid">
            <article>
                <h2>Venom Pre-W</h2>
                <span class="price">R$ 149,90</span>
                <p style="font-family: Arial; font-size: 0.8rem; color: #ccc; margin-bottom: 20px;">Fórmula americana. Foco extremo.</p>
                <button>Comprar</button>
            </article>

            <article>
                <h2>Iso-Protein</h2>
                <span class="price">R$ 289,00</span>
                <p style="font-family: Arial; font-size: 0.8rem; color: #ccc; margin-bottom: 20px;">Proteína isolada. Zero açúcar.</p>
                <button>Comprar</button>
            </article>
        </section>
    </main>

    <footer>
        REVOLUXTI © POWERED BY CODE.
    </footer>

</body>
</html>
