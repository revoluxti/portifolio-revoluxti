<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estrutura Semântica 3 - Galeria Criativa</title>
    <style>
        /* TEMA: CREATIVE GRADIENT (Roxo e Laranja) */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Verdana', sans-serif;
            background: #f0f0f0;
            display: flex; /* Mudança drástica no layout do body */
            min-height: 100vh;
        }

        /* HEADER SEMÂNTICO: Lateral (Sidebar Fixa) */
        header {
            width: 250px; /* Largura fixa */
            background: linear-gradient(180deg, #6a11cb 0%, #2575fc 100%); /* Gradiente Roxo/Azul */
            color: white;
            padding: 40px 20px;
            display: flex;
            flex-direction: column; /* Itens um embaixo do outro */
            position: fixed; /* Fica parado na tela */
            height: 100vh;
        }

        header h1 { font-size: 1.8rem; margin-bottom: 50px; }

        nav ul { list-style: none; display: flex; flex-direction: column; gap: 20px; }
        
        nav a { 
            color: rgba(255,255,255,0.7); 
            text-decoration: none; 
            font-size: 1.1rem; 
            transition: 0.3s;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        
        nav a:hover { 
            background: rgba(255,255,255,0.2); 
            color: #fff; 
            padding-left: 20px; /* Efeito de movimento */
        }

        /* MAIN: Precisa de margem esquerda para não ficar embaixo do header */
        main {
            margin-left: 250px; /* Mesma largura do header */
            padding: 50px;
            width: 100%;
            background: #fff;
        }

        h2 { color: #333; margin-bottom: 30px; border-bottom: 4px solid #6a11cb; display: inline-block; }

        /* GALERIA COM TAGS SEMÂNTICAS */
        .galeria {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* TAG SEMÂNTICA: FIGURE (Imagem com Legenda) */
        figure {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 300px;
        }

        figure img { width: 100%; border-radius: 5px; height: 200px; object-fit: cover; background: #ddd; }

        /* TAG SEMÂNTICA: FIGCAPTION (Legenda da Figura) */
        figcaption {
            margin-top: 10px;
            font-weight: bold;
            color: #6a11cb;
            text-align: center;
        }

    </style>
</head>
<body>

    <header>
        <h1>Creative<br>Studio.</h1>
        <nav>
            <ul>
                <li><a href="#">Portfólio</a></li>
                <li><a href="#">Ilustrações</a></li>
                <li><a href="#">Fotografia</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
        
        <div style="margin-top: auto; font-size: 0.8rem; opacity: 0.6;">
            &copy; 2025
        </div>
    </header>

    <main>
        <h2>Galeria de Projetos</h2>
        <p style="margin-bottom: 30px; color: #666;">
            Neste layout, quebramos o padrão! O <code>&lt;header&gt;</code> foi transformado em uma barra lateral fixa. 
            Usamos as tags <code>&lt;figure&gt;</code> e <code>&lt;figcaption&gt;</code> para criar cards de imagem semanticamente corretos.
        </p>

        <section class="galeria">
            <figure>
                <div style="width:100%; height:200px; background:#ff9a9e; border-radius:5px;"></div>
                <figcaption>Projeto Design UX</figcaption>
            </figure>

            <figure>
                <div style="width:100%; height:200px; background:#a18cd1; border-radius:5px;"></div>
                <figcaption>App Mobile</figcaption>
            </figure>

            <figure>
                <div style="width:100%; height:200px; background:#fbc2eb; border-radius:5px;"></div>
                <figcaption>Identidade Visual</figcaption>
            </figure>
        </section>
    </main>

</body>
</html>
