<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RVLXTI Dance & Drinks</title>
    <style>
        /* --- PALETA: RED LIGHT DISTRICT --- */
        :root {
            --bg: #000000;
            --red-light: rgba(255, 0, 0, 0.6);
            --yellow-light: rgba(255, 215, 0, 0.5);
            --text: #ffffff;
            --accent: #ff004c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Impact', 'Anton', sans-serif; /* Fonte Poster */
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* EFEITO DE LUZES (HOLOFOTES) */
        .spotlight-1 {
            position: absolute; top: -20%; left: -10%;
            width: 80vw; height: 80vh;
            background: radial-gradient(circle, var(--red-light) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            animation: pulse-red 4s infinite alternate;
        }
        
        .spotlight-2 {
            position: absolute; bottom: -10%; right: -10%;
            width: 70vw; height: 70vh;
            background: radial-gradient(circle, var(--yellow-light) 0%, transparent 60%);
            filter: blur(50px);
            z-index: -1;
            mix-blend-mode: screen; /* Mistura as luzes */
            animation: pulse-yellow 5s infinite alternate;
        }

        @keyframes pulse-red { 0% { opacity: 0.5; } 100% { opacity: 0.8; } }
        @keyframes pulse-yellow { 0% { opacity: 0.3; } 100% { opacity: 0.7; } }

        /* HEADER SEMÂNTICO */
        header {
            padding: 40px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        header h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            /* Texto vazado (Outline) */
            color: transparent;
            -webkit-text-stroke: 2px #fff;
            margin-bottom: 10px;
        }
        
        header span {
            display: block;
            color: var(--yellow-light);
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 8px;
            font-weight: bold;
        }

        nav ul {
            display: flex; justify-content: center; gap: 40px; margin-top: 30px; list-style: none;
        }
        
        nav a { 
            color: #fff; text-decoration: none; 
            font-family: 'Arial', sans-serif; font-size: 0.8rem; text-transform: uppercase; 
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            transition: 0.3s;
        }
        nav a:hover { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 20px var(--accent); }

        /* MAIN */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* CARD ESTILO INGRESSO/TICKET */
        article {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            padding: 30px;
            position: relative;
            transform: skew(-5deg); /* Inclinação para dinamismo */
            transition: 0.3s;
        }
        
        article:hover { transform: skew(-5deg) translateY(-10px); border-color: #fff; }

        h2 { font-size: 2.5rem; color: #fff; margin-bottom: 10px; }
        
        .price {
            font-family: 'Arial', sans-serif;
            color: gold;
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        /* TEXTURA DE FUNDO (PONTINHOS) */
        .overlay-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#ffffff 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) { main { grid-template-columns: 1fr; } header h1 { font-size: 3rem; } }
    </style>
</head>
<body>

    <div class="spotlight-1"></div>
    <div class="spotlight-2"></div>
    <div class="overlay-grid"></div>

    <header>
        <h1>RVLXTI</h1>
        <span>DANCE | DRINKS | BILHAR</span>
        <nav>
            <ul>
                <li><a href="#">Line-up</a></li>
                <li><a href="#">Camarotes</a></li>
                <li><a href="#">Bar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <p style="font-family:Arial; font-size:0.7rem; color:#aaa; margin-bottom:10px;">HOJE À NOITE</p>
            <h2>DJ RESIDENT</h2>
            <p style="font-family:Arial; font-size:0.9rem; color:#ccc;">House & Techno Underground. Open Bar até 00h.</p>
            <span class="price">R$ 50,00</span>
        </article>

        <article style="border-color: var(--accent);">
            <p style="font-family:Arial; font-size:0.7rem; color:#aaa; margin-bottom:10px;">PROMO BAR</p>
            <h2 style="color: var(--accent);">GIN TÔNICA</h2>
            <p style="font-family:Arial; font-size:0.9rem; color:#ccc;">Dobradinha a noite toda. Sabores exóticos.</p>
            <span class="price">2x R$ 35,00</span>
        </article>
    </main>

    <footer>
        SISTEMA: REVOLUXTI NIGHTLIFE OPS.
    </footer>

</body>
</html>
