<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>REVOLUTI Criativ</title>
    <style>
        /* TEMA: MODERN DASHBOARD */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f3f4f6;
            display: flex; 
            min-height: 100vh;
        }

        /* SIDEBAR: Fundo Escuro Sofisticado */
        header {
            width: 260px;
            /* Gradiente Preto para Cinza Chumbo */
            background: linear-gradient(180deg, #111827 0%, #1f2937 100%); 
            color: white;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            border-right: 1px solid #374151;
        }

        header h1 { font-size: 1.5rem; margin-bottom: 60px; color: #fff; letter-spacing: 1px;}
        header h1 span { color: #10b981; } /* Verde Esmeralda */

        nav ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        
        nav a { 
            color: #9ca3af; 
            text-decoration: none; 
            font-size: 1rem; 
            font-weight: 500;
            display: block;
            padding: 12px 15px;
            border-radius: 8px;
            transition: 0.2s;
        }
        
        nav a:hover { 
            background: #374151; 
            color: #fff; 
            transform: translateX(5px); /* Pequeno movimento para direita */
        }

        main {
            margin-left: 260px;
            padding: 60px;
            width: 100%;
        }

        h2 { 
            color: #111827; 
            margin-bottom: 40px; 
            font-size: 2rem;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
        }

        /* GALERIA DE CARDS */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* Responsivo automático */
            gap: 30px;
        }

        figure {
            background: #fff;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        figure:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Placeholder de imagem com cores gradientes bonitas */
        .img-placeholder {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        figcaption {
            font-weight: 700;
            color: #374151;
            font-size: 1.1rem;
        }
        
        figcaption span {
            display: block;
            font-size: 0.8rem;
            color: #9ca3af;
            font-weight: 400;
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Art<span>Station</span></h1>
        <nav>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Meus Projetos</a></li>
                <li><a href="#">Analytics</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </nav>
        
        <div style="margin-top: auto; font-size: 0.8rem; color: #6b7280;">
            Logado como Revoluti
        </div>
    </header>

    <main>
        <h2>Visão Geral</h2>
        
        <section class="galeria">
            <figure>
                <div class="img-placeholder" style="background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);"></div>
                <figcaption>Marketing UI <span>App Mobile</span></figcaption>
            </figure>

            <figure>
                <div class="img-placeholder" style="background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);"></div>
                <figcaption>Fintech Dashboard <span>Sistema Web</span></figcaption>
            </figure>

            <figure>
                <div class="img-placeholder" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);"></div>
                <figcaption>E-commerce <span>Identidade Visual</span></figcaption>
            </figure>
        </section>
    </main>

</body>
</html>
