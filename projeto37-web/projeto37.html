<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLUXTI 3 - Galeria Criativa</title>
    <style>
        /* =========================================
           TEMA: CREATIVE GRADIENT
           Conceito: Moderno, artístico, uso de gradientes e layout lateral.
           ========================================= */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Verdana', sans-serif;
            background: #f0f0f0;
            
            /* LAYOUT PRINCIPAL: FLEXBOX
               No desktop, os elementos ficam lado a lado (Sidebar + Main).
            */
            display: flex; 
            min-height: 100vh;
        }

        /* --- HEADER SEMÂNTICO (Barra Lateral) --- 
           Aqui o <header> funciona como uma Sidebar Fixa.
        */
        header {
            width: 250px; /* Largura fixa */
            background: linear-gradient(180deg, #6a11cb 0%, #2575fc 100%); /* Gradiente Roxo/Azul */
            color: white;
            padding: 40px 20px;
            
            /* Fixa o menu na tela enquanto o resto rola */
            display: flex;
            flex-direction: column; 
            position: fixed; 
            height: 100vh; /* Ocupa toda a altura da tela */
            overflow-y: auto; /* Permite rolar o menu se for muito alto */
        }

        header h1 { font-size: 1.8rem; margin-bottom: 50px; }

        nav ul { list-style: none; display: flex; flex-direction: column; gap: 20px; }
        
        nav a { 
            color: rgba(255,255,255,0.7); 
            text-decoration: none; 
            font-size: 1.1rem; 
            transition: 0.3s;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        
        /* Hover: Efeito de destaque e leve movimento */
        nav a:hover { 
            background: rgba(255,255,255,0.2); 
            color: #fff; 
            padding-left: 20px; 
        }

        /* --- MAIN (CONTEÚDO) --- */
        main {
            /* Margem esquerda igual à largura da sidebar para não ficar por baixo dela */
            margin-left: 250px; 
            padding: 50px;
            width: 100%;
            background: #fff;
            min-height: 100vh;
        }

        h2 { 
            color: #333; 
            margin-bottom: 30px; 
            border-bottom: 4px solid #6a11cb; 
            display: inline-block; 
        }
        
        p { line-height: 1.6; margin-bottom: 20px; color: #555; }
        code { background: #eee; padding: 2px 5px; border-radius: 4px; color: #d63384; }

        /* --- GALERIA COM TAGS SEMÂNTICAS --- */
        .galeria {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* Permite quebrar linha se não couber */
        }

        /* TAG SEMÂNTICA: FIGURE 
           Usada para agrupar uma imagem com sua legenda.
           Melhora a acessibilidade e o SEO.
        */
        figure {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 300px; /* Largura base */
            flex-grow: 1; /* Cresce para preencher espaços vazios */
            max-width: 400px; /* Limite de largura */
        }

        figure img { 
            width: 100%; 
            border-radius: 5px; 
            height: 200px; 
            object-fit: cover; 
            background: #ddd; 
        }

        /* TAG SEMÂNTICA: FIGCAPTION (Legenda da Figura) */
        figcaption {
            margin-top: 10px;
            font-weight: bold;
            color: #6a11cb;
            text-align: center;
        }

        /* =========================================
           RESPONSIVIDADE (MEDIA QUERIES)
           ========================================= */
        
        /* Tablet e Celular (até 768px) */
        @media (max-width: 768px) {
            
            /* Muda a direção do layout para coluna (um em cima do outro) */
            body {
                flex-direction: column;
            }

            /* Transforma a Sidebar em Topbar */
            header {
                width: 100%;          /* Largura total */
                height: auto;         /* Altura automática */
                position: relative;   /* Deixa de ser fixo */
                padding: 20px;
                text-align: center;
            }
            
            header h1 { margin-bottom: 20px; font-size: 1.5rem; }
            
            nav ul { 
                flex-direction: row;  /* Menu horizontal */
                flex-wrap: wrap; 
                justify-content: center; 
            }
            
            nav a:hover { padding-left: 10px; } /* Remove movimento lateral no mobile */

            /* Ajuste do Main */
            main {
                margin-left: 0; /* Remove a margem lateral */
                padding: 30px 20px;
            }

            /* Ajuste da Galeria */
            .galeria {
                justify-content: center;
            }
            
            figure {
                width: 100%; /* Card ocupa largura total no celular */
                max-width: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Creative<br>Studio.</h1>
        <nav>
            <ul>
                <li><a href="#">Portfólio</a></li>
                <li><a href="#">Ilustrações</a></li>
                <li><a href="#">Fotografia</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
        
        <div style="margin-top: auto; font-size: 0.8rem; opacity: 0.6; padding-top: 20px;">
            &copy; 2025 Revoluxti
        </div>
    </header>

    <main>
        <h2>Galeria de Projetos</h2>
        <p>
            Neste layout, quebramos o padrão! O <code>&lt;header&gt;</code> foi transformado em uma <strong>barra lateral fixa</strong>. 
            Usamos as tags <code>&lt;figure&gt;</code> e <code>&lt;figcaption&gt;</code> para criar cards de imagem semanticamente corretos.
        </p>

        <section class="galeria">
            <figure>
                <div style="width:100%; height:200px; background:#ff9a9e; border-radius:5px;"></div>
                <figcaption>Projeto Design UX</figcaption>
            </figure>

            <figure>
                <div style="width:100%; height:200px; background:#a18cd1; border-radius:5px;"></div>
                <figcaption>O Abapuru</figcaption>
            </figure>

            <figure>
                <div style="width:100%; height:200px; background:#fbc2eb; border-radius:5px;"></div>
                <figcaption>O grito</figcaption>
            </figure>
             
        </section>
    </main>

</body>
</html>
